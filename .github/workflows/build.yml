name: CI

on:
  pull_request:
  # Push runs only for main. `on: [push, pull_request]` ran every PR branch
  # twice — once for the push, once for the pull request — for the same commit.
  push:
    branches: [main]
  # Lets the Notion sync start this for its own pull requests. GitHub holds
  # workflows on a pull request opened by github-actions[bot] for manual
  # approval, so without this the content PRs ran no tests unless someone
  # clicked "Approve and run". See the dispatch step in sync-notion.yml.
  workflow_dispatch:

# A newer push to the same pull request makes the older run worthless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No `version:` — pinned via `packageManager` in package.json. See the
      # note in sync-notion.yml for why this must not float.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `next build` type-checks too, but not the whole project: test files
      # with type errors passed it. This covers everything tsconfig includes.
      - name: Type check
        run: pnpm typecheck

      # Unit, component and content tests: the renderer, the resolver, every
      # API route, and every committed page rendered and link-checked.
      - name: Test
        run: pnpm test

  e2e:
    name: Build + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Its own step, so a broken build reads as a broken build rather than as
      # a wall of failed browser tests.
      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Against `next start` on the build above: a crawl of every page and
      # every internal link, then real-browser checks of what needs hydration.
      - name: E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
